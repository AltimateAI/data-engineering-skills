name: support_forecast_daily
team: support
tier: standard
description: Forecast pipeline for support
schedule:
  hour: 0
  days: '*'
steps:
- name: extract
  table: support.raw_forecast_00
- name: stage
  table: support.stg_forecast_00
  depends_on:
  - extract
- name: validate
  table: support.int_forecast_00
  depends_on:
  - stage
- name: transform
  table: support.int_forecast_00
  depends_on:
  - validate
- name: enrich
  table: support.int_forecast_00
  depends_on:
  - transform
  - validate
- name: snapshot
  table: support.int_forecast_00
  depends_on:
  - enrich
- name: publish
  table: support.mart_forecast_00
  depends_on:
  - snapshot
  - enrich
