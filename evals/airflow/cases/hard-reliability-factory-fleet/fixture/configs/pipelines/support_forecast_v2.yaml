name: support_forecast_v2
team: support
tier: standard
description: Forecast pipeline for support
schedule:
  hour: 1
  days: '1'
steps:
- name: extract
  table: support.raw_forecast_00
- name: transform
  table: support.int_forecast_00
  depends_on:
  - extract
- name: enrich
  table: support.int_forecast_00
  depends_on:
  - transform
- name: aggregate
  table: support.int_forecast_00
  depends_on:
  - enrich
- name: snapshot
  table: support.int_forecast_00
  depends_on:
  - aggregate
- name: publish
  table: support.mart_forecast_00
  depends_on:
  - snapshot
