name: marketing_forecast
team: marketing
tier: standard
description: Forecast pipeline for marketing
schedule:
  hour: 1
  days: '*'
retries: 0
steps:
- name: extract
  table: marketing.raw_forecast_00
- name: stage
  table: marketing.stg_forecast_00
  depends_on:
  - extract
- name: validate
  table: marketing.int_forecast_00
  depends_on:
  - stage
- name: transform
  table: marketing.int_forecast_00
  depends_on:
  - validate
  - stage
- name: enrich
  table: marketing.int_forecast_00
  depends_on:
  - transform
  - validate
- name: aggregate
  table: marketing.int_forecast_00
  depends_on:
  - enrich
- name: publish
  table: marketing.mart_forecast_00
  depends_on:
  - aggregate
