name: support_fraud_scores
team: support
tier: standard
description: Fraud Scores pipeline for support
schedule:
  hour: 5
  days: '1'
owners:
- gus
- ben
retries: 1
steps:
- name: extract
  table: support.raw_fraud_scores_00
- name: stage
  table: support.stg_fraud_scores_00
  depends_on:
  - extract
- name: transform
  table: support.int_fraud_scores_00
