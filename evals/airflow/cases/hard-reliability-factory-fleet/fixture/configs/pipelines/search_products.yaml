name: search_products
team: search
tier: standard
description: Products pipeline for search
schedule:
  hour: 0
  days: '*'
retries: 0
steps:
- name: extract
  table: search.raw_products_00
- name: validate
  table: search.int_products_00
  depends_on:
  - extract
- name: transform
  table: search.int_products_00
  depends_on:
  - validate
- name: enrich
  table: search.int_products_00
  depends_on:
  - transform
- name: aggregate
  table: search.int_products_00
  depends_on:
  - enrich
- name: publish
  table: search.mart_products_00
  depends_on:
  - aggregate
