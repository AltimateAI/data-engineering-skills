name: billing_promotions
team: billing
tier: standard
description: Promotions pipeline for billing
schedule:
  hour: 0
  days: '*'
steps:
- name: extract
  table: billing.raw_promotions_00
- name: stage
  table: billing.stg_promotions_00
  depends_on:
  - extract
- name: transform
  table: billing.int_promotions_00
  depends_on:
  - stage
- name: enrich
  table: billing.int_promotions_00
  depends_on:
  - transform
- name: aggregate
  table: billing.int_promotions_00
  depends_on:
  - enrich
- name: snapshot
  table: billing.int_promotions_00
  depends_on:
  - aggregate
- name: publish
  table: billing.mart_promotions_00
  depends_on:
  - snapshot
  - aggregate
