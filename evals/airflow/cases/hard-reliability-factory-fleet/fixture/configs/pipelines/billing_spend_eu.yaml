name: billing_spend_eu
team: billing
tier: standard
description: Spend pipeline for billing
schedule:
  hour: 4
  days: '*'
  minute: 0
steps:
- name: extract
  table: billing.raw_spend_00
- name: enrich
  table: billing.int_spend_00
  depends_on:
  - extract
- name: aggregate
  table: billing.int_spend_00
  depends_on:
  - enrich
- name: snapshot
  table: billing.int_spend_00
  depends_on:
  - aggregate
- name: publish
  table: billing.mart_spend_00
  depends_on:
  - snapshot
