name: growth_orders
team: growth
tier: standard
description: Orders pipeline for growth
schedule:
  hour: 3
  days: 1-5
retries: 4
steps:
- name: extract
  table: growth.raw_orders_00
- name: stage
  table: growth.stg_orders_00
  depends_on:
  - extract
- name: validate
  table: growth.int_orders_00
  depends_on:
  - stage
  - extract
- name: enrich
  table: growth.int_orders_00
  depends_on:
  - validate
- name: aggregate
  table: growth.int_orders_00
  depends_on:
  - enrich
  - validate
- name: publish
  table: growth.mart_orders_00
  depends_on:
  - aggregate
