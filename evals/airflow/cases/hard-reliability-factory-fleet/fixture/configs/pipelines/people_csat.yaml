- name: stage
  table: people.stg_csat_00
  depends_on:
  - extract
- name: transform
  table: people.int_csat_00
  depends_on:
  - stage
- name: enrich
  table: people.int_csat_00
  depends_on:
  - transform
  - stage
- name: aggregate
  table: people.int_csat_00
  depends_on:
  - enrich
- name: snapshot
  table: people.int_csat_00
