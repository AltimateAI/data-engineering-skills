id: authoring-partner-feeds-mapping
area: authoring
split: holdout
airflow_version: "3.3"
max_turns: 40
timeout_s: 900
grade_timeout_s: 1500
prompt: |
  Partners upload their daily order files to
  data/partner_drop/<YYYY-MM-DD>/<partner>.csv (columns order_id,amount). The
  set of partners changes all the time, and on some days nobody sends anything,
  in which case that date's folder doesn't exist at all.

  I need a daily DAG `partner_feeds` that handles the files for the run's date.
  Every file has to be processed as its own task instance, so a broken file
  only fails (and retries) its own work and doesn't hold up the others. For
  each file, write output/partner_feeds/<date>/<partner>.json containing
  {"partner": ..., "rows": <row count>, "total_amount": <sum of amount, 2 dp>}.

  Once every file is processed, write output/partner_feeds/<date>/summary.json
  with {"files": <file count>, "rows": <total rows>, "total_amount": <total>}.
  The summary has to be written even on days with no files (all zeros),
  because finance checks it every morning.

  We need to be able to rerun any date since 2026-09-01.
description: |
  Dynamic task mapping over a list produced at runtime (P9) without parse-time
  file listing (P3). Primary: DAG imports; task ids are identical when parsed
  with the sample files, with no partner_drop dir, and with extra files (so no
  parse-time loop); at least one mapped task; `airflow dags test` succeeds for
  days with 0, 1 and 4 files and some mapped task expands to exactly 0/1/4
  instances; per-partner JSONs and summary.json are correct (the summary must
  exist on the empty day, which needs a trigger rule or equivalent because an
  empty expansion skips the mapped task); a rerun reproduces the outputs.
  The grader replaces data/partner_drop with grader_data/partner_drop (different
  rows, and a partner missing from data/partners.json). A mapped task group
  counts as mapping.
  Mutants: one task per file generated by a parse-time loop, a single task that
  loops over all files, a summary with the default trigger rule (skipped on
  empty days), a lister that fails when the date folder is missing, mapping over
  the partner registry instead of the files.
